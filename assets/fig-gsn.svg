<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="安全论证 GSN 骨架">
  <defs>
    <style>
      .t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12.2px;fill:#101a26}
      .ts{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11px;fill:#5d6b7a}
      .goal{fill:#fff;stroke:#0d4f7c;stroke-width:1.4}
      .gsub{fill:#f3f7fa;stroke:#93a6b6;stroke-width:1.2}
      .strat{fill:#fdf3ea;stroke:#e2a06a;stroke-width:1.3}
      .sol{fill:#e8f4ee;stroke:#0f7a5a;stroke-width:1.2}
      .ctx{fill:#f6f8fa;stroke:#c8d3dd;stroke-width:1.1;stroke-dasharray:4 3}
      .ln{stroke:#7d8f9e;stroke-width:1.2;fill:none}
      .lab{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11px;font-weight:700;fill:#0d4f7c}
    </style>
    <marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8f9e"/>
    </marker>
  </defs>

  <!-- G1 -->
  <rect class="goal" x="330" y="14" width="320" height="66" rx="8"/>
  <text class="lab" x="342" y="32">G1</text>
  <text class="t" x="490" y="52" text-anchor="middle" font-weight="600">分体式飞行汽车在限定运行场景内的</text>
  <text class="t" x="490" y="70" text-anchor="middle" font-weight="600">残余风险可接受</text>

  <!-- 上下文 -->
  <rect class="ctx" x="20" y="20" width="270" height="58" rx="7"/>
  <text class="lab" x="32" y="38" fill="#5d6b7a">C1</text>
  <text class="ts" x="32" y="56">运行限定于获许可的起降场与训练人员；</text>
  <text class="ts" x="32" y="70">不覆盖极端气象与蓄意攻击</text>

  <rect class="ctx" x="690" y="20" width="270" height="58" rx="7"/>
  <text class="lab" x="702" y="38" fill="#5d6b7a">A1</text>
  <text class="ts" x="702" y="56">乘员已知情并接受演示/体验类风险；</text>
  <text class="ts" x="702" y="70">制造商公开披露的数据视为可信</text>

  <!-- S1 -->
  <rect class="strat" x="300" y="96" width="380" height="70" rx="8"/>
  <text class="lab" x="314" y="116" fill="#a15c00">S1</text>
  <text class="t" x="490" y="128" text-anchor="middle" font-weight="600">按危害清单逐项论证（HAZOP + STPA 双轨）</text>
  <text class="ts" x="490" y="150" text-anchor="middle" font-size="10.5">每一危害均有“安全需求—设计措施—验证证据”闭环</text>

  <!-- G2 -->
  <rect class="goal" x="290" y="176" width="400" height="46" rx="8"/>
  <text class="lab" x="302" y="194">G2</text>
  <text class="t" x="490" y="204" text-anchor="middle">全部已识别安全关键危害已控制到可接受水平</text>

  <!-- 四个子目标 -->
  <g>
    <rect class="gsub" x="16" y="262" width="224" height="78" rx="7"/>
    <text class="lab" x="28" y="280">G2.1</text>
    <text class="t" x="28" y="298">动力/飞控单点失效</text>
    <text class="t" x="28" y="316">不导致失控或迫降</text>
    <text class="ts" x="28" y="332" fill="#c2410c">安全需求：失效后仍可控</text>

    <rect class="gsub" x="256" y="262" width="224" height="78" rx="7"/>
    <text class="lab" x="268" y="280">G2.2</text>
    <text class="t" x="268" y="298">分离/结合失效</text>
    <text class="t" x="268" y="316">不造成坠落或误起飞</text>
    <text class="ts" x="268" y="332" fill="#c2410c">安全需求：双通道互锁</text>

    <rect class="gsub" x="496" y="262" width="224" height="78" rx="7"/>
    <text class="lab" x="508" y="280">G2.3</text>
    <text class="t" x="508" y="298">起降与地面运行</text>
    <text class="t" x="508" y="316">不伤及第三方与乘员</text>
    <text class="ts" x="508" y="332" fill="#c2410c">安全需求：隔离区与程序</text>

    <rect class="gsub" x="736" y="262" width="228" height="78" rx="7"/>
    <text class="lab" x="748" y="280">G2.4</text>
    <text class="t" x="748" y="298">软件与数据链路</text>
    <text class="t" x="748" y="316">不可被非授权操控</text>
    <text class="ts" x="748" y="332" fill="#c2410c">安全需求：鉴权与加密</text>
  </g>

  <!-- 连线 G1->S1->G2 -->
  <path class="ln" d="M490 80 L490 94" marker-end="url(#g1)"/>
  <path class="ln" d="M490 166 L490 174" marker-end="url(#g1)"/>
  <path class="ln" d="M490 222 L490 240 L128 240 L128 260" marker-end="url(#g1)"/>
  <path class="ln" d="M490 240 L368 240 L368 260" marker-end="url(#g1)"/>
  <path class="ln" d="M490 240 L608 240 L608 260" marker-end="url(#g1)"/>
  <path class="ln" d="M490 240 L850 240 L850 260" marker-end="url(#g1)"/>

  <!-- 证据（圆形 solutions） -->
  <g>
    <circle class="sol" cx="128" cy="400" r="30"/>
    <text class="lab" x="128" y="396" text-anchor="middle" fill="#0f7a5a">S1</text>
    <text class="ts" x="128" y="410" text-anchor="middle" fill="#0f7a5a">故障注入</text>
    <text class="ts" x="128" y="452" text-anchor="middle">HIL 台架 + 单点/多点</text>
    <text class="ts" x="128" y="466" text-anchor="middle">失效试飞证据</text>

    <circle class="sol" cx="368" cy="400" r="30"/>
    <text class="lab" x="368" y="396" text-anchor="middle" fill="#0f7a5a">S2</text>
    <text class="ts" x="368" y="410" text-anchor="middle" fill="#0f7a5a">互锁试验</text>
    <text class="ts" x="368" y="452" text-anchor="middle">解锁状态机 + 误操作</text>
    <text class="ts" x="368" y="466" text-anchor="middle">组合试验记录</text>

    <circle class="sol" cx="608" cy="400" r="30"/>
    <text class="lab" x="608" y="396" text-anchor="middle" fill="#0f7a5a">S3</text>
    <text class="ts" x="608" y="410" text-anchor="middle" fill="#0f7a5a">场地评估</text>
    <text class="ts" x="608" y="452" text-anchor="middle">净空/噪声/应急演练</text>
    <text class="ts" x="608" y="466" text-anchor="middle">运行手册与培训记录</text>

    <circle class="sol" cx="850" cy="400" r="30"/>
    <text class="lab" x="850" y="396" text-anchor="middle" fill="#0f7a5a">S4</text>
    <text class="ts" x="850" y="410" text-anchor="middle" fill="#0f7a5a">渗透测试</text>
    <text class="ts" x="850" y="452" text-anchor="middle">TARA 威胁分析</text>
    <text class="ts" x="850" y="466" text-anchor="middle">通信与升级链路验证</text>
  </g>

  <path class="ln" d="M128 340 L128 368" marker-end="url(#g1)"/>
  <path class="ln" d="M368 340 L368 368" marker-end="url(#g1)"/>
  <path class="ln" d="M608 340 L608 368" marker-end="url(#g1)"/>
  <path class="ln" d="M850 340 L850 368" marker-end="url(#g1)"/>

  <text class="ts" x="490" y="500" text-anchor="middle">说明：本图为方法骨架示意图，用于说明论证结构；具体参数、证据强度与残余风险等级需以制造商公开材料与局方审定为据。</text>
</svg>



